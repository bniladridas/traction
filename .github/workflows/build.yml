# traction build: compile the Unreal editor target on macOS ARM64.
# Requires a self-hosted macOS ARM64 runner with Unreal Engine 5.8.2 and
# Xcode installed. This workflow never runs on github-hosted runners:
# they cannot provide the engine. Until a runner exists, run the same
# commands locally (see command below).
name: build

on:
  push:
    paths:
      - "game/RacingGame/Source/**"
      - "game/RacingGame/*.uproject"
      - "game/RacingGame/Config/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate project files
        run: /Users/Shared/UE_5.8/Engine/Build/BatchFiles/Mac/GenerateProjectFiles.sh -project="${{ github.workspace }}/game/RacingGame/RacingGame.uproject" -game -engine
      - name: Build editor target
        run: /Users/Shared/UE_5.8/Engine/Build/BatchFiles/Mac/Build.sh TP_VehicleAdvEditor Mac Development -project="${{ github.workspace }}/game/RacingGame/RacingGame.uproject"
