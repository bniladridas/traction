# traction contract checks: repository invariants on GitHub-hosted runners.
# Policy: no self-hosted runner. GitHub-hosted CI validates what is
# checkable without Unreal (file presence, frozen threshold namespaces,
# tooling syntax, no stale runner references). Measured results
# (results.json, 40 flags) are produced and checked on the local Apple
# Silicon Mac; see docs/testing.md for the local procedure. Saved/
# artifacts are gitignored, so GitHub never sees measured values, only
# the frozen contract definitions.
name: test

on:
  push:
    paths:
      - "game/RacingGame/Source/**"
      - "game/RacingGame/Content/**"
      - "game/RacingGame/*.uproject"
      - "game/RacingGame/Config/**"
      - "tools/**"
      - "docs/**"
      - ".github/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verification docs present (Tasks 1-8)
        run: for n in 1 2 3 4 5 6 7 8; do test -f docs/verification/task-$n-e2e.md || exit 1; done; echo "verification docs present"
      - name: Frozen threshold namespaces present
        run: grep -q "namespace Task2Limits" game/RacingGame/Source/RacingGame/Test/Task2Probe.h && grep -q "namespace Task3Limits" game/RacingGame/Source/RacingGame/Test/Task2Probe.h && grep -q "namespace Task5Limits" game/RacingGame/Source/RacingGame/Test/Task2Probe.h && grep -q "namespace Task6Limits" game/RacingGame/Source/RacingGame/Test/Task2Probe.h && grep -q "namespace Task7Limits" game/RacingGame/Source/RacingGame/Test/Task7Probe.h && grep -q "namespace Task8Limits" game/RacingGame/Source/RacingGame/Test/Task8Probe.h && grep -q "namespace Task9Limits" game/RacingGame/Source/RacingGame/Test/Task9Probe.h && grep -q "namespace Task10Limits" game/RacingGame/Source/RacingGame/Test/Task10Probe.h && grep -q "namespace Task11Limits" game/RacingGame/Source/RacingGame/Test/Task11Probe.h && echo "frozen namespaces present"
      - name: Probe and config headers present
        run: for f in game/RacingGame/Source/RacingGame/Test/Task2Probe.h game/RacingGame/Source/RacingGame/Test/Task7Probe.h game/RacingGame/Source/RacingGame/Test/Task8Probe.h game/RacingGame/Source/RacingGame/Vehicle/RaceVehicleConfig.h game/RacingGame/Source/RacingGame/Track/RaceTrackConfig.h game/RacingGame/Source/RacingGame/Race/RaceConfig.h; do test -f $f || exit 1; done; echo "headers present"
      - name: Python tooling compiles
        run: python3 -m py_compile game/RacingGame/Content/Python/task2_create_map.py game/RacingGame/Content/Python/track1_create_map.py tools/check_regression.py && echo "tooling compiles"
      - name: Uproject JSON parses
        run: python3 -c "import json; json.load(open('game/RacingGame/RacingGame.uproject')); print('uproject OK')"
      - name: No self-hosted runner dependencies
        run: "! grep -rn 'runs-on:.*[s]elf-hosted' .github/ --exclude-dir=.git"
